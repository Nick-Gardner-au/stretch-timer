# Builds the Training desktop app for Linux (AppImage and .deb).
# Run it from the Actions tab (Run workflow), or push a tag such as desktop-v1.0.0 to also
# publish the files on a GitHub Release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist:linux -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: training-linux
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
