<!doctype html>
<html lang="en-AU" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training</title>
  <meta name="description" content="Stretch Timer, Pilates Mat and Mobility in one app">
  <meta name="theme-color" content="#141414">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .home {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top) + 18px) 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .home h1 {
      margin: 0 0 4px;
      font-family: var(--display);
      font-weight: 400;
      font-size: 44px;
      line-height: 1;
      color: var(--hi);
    }
    .home .sub {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 14px;
    }
    .app-card {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      background: var(--card);
      border-radius: 14px;
      color: var(--fg);
      text-decoration: none;
    }
    .app-card:active { background: var(--raised); }
    .app-card img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: block;
    }
    .app-card b {
      display: block;
      font-family: var(--display);
      font-weight: 400;
      font-size: 28px;
      line-height: 1;
      text-transform: uppercase;
    }
    .app-card p {
      margin: 4px 0 0;
      font-size: 14px;
      color: var(--muted);
    }
    .app-card .status {
      margin-top: 6px;
      font-size: 12px;
      color: var(--work);
    }
    .app-card .chev {
      font-size: 26px;
      color: var(--hi);
    }
    .last {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent);
      color: var(--accent-fg);
      font-family: var(--body);
      font-size: 11px;
      vertical-align: middle;
    }
    .sync-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 12px;
      align-items: center;
      padding: 14px;
      background: var(--card);
      border-radius: 14px;
    }
    .sync-panel b {
      display: block;
      font-family: var(--display);
      font-weight: 400;
      font-size: 22px;
      line-height: 1;
    }
    .sync-panel p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
    .sync-panel p.ok { color: var(--work); }
    .sync-panel p.err { color: var(--rest); }
    .sync-panel .btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .sheet ol.setup { padding-left: 22px; font-size: 15px; line-height: 1.45; }
    .sheet ol.setup li { margin-bottom: 8px; }
    .sheet a { color: var(--hi); }
    .sheet input[type="password"], .sheet input[type="text"].token {
      width: 100%;
      background: var(--raised);
      border: 1px solid var(--track);
      border-radius: 6px;
      padding: 9px 10px;
      font-size: 16px;
      color: var(--fg);
    }
    .note {
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
    }
    /* wide screens: three cards side by side, centred */
    @media (min-width: 900px) and (min-aspect-ratio: 5/4) {
      .home {
        max-width: 1200px;
        justify-content: center;
        padding: 48px 32px;
      }
      .home h1 { font-size: 64px; }
      .home .sub { font-size: 16px; margin-bottom: 18px; }
      #apps { display: grid !important; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px !important; }
      .app-card {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        justify-items: center;
        text-align: center;
        align-content: start;
        padding: 32px 24px;
      }
      .app-card img { width: 128px; height: 128px; border-radius: 28px; }
      .app-card b { font-size: 36px; }
      .app-card p { font-size: 15px; }
      .app-card .chev { display: none; }
      .note { margin-top: 24px; text-align: center; }
      .sync-panel { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <main class="home">
    <h1>TRAINING</h1>
    <p class="sub">Choose an app. Tap the title at the top of any app to switch back.</p>
    <div id="apps"></div>
    <section id="sync" class="sync-panel"></section>
    <p class="note">Each app keeps its own settings on this device. With sync on, Pilates and Mobility progress is shared between your devices.</p>
  </main>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel">
      <div id="sheetBody" class="sheet-body"></div>
      <div id="sheetButtons" class="sheet-buttons"></div>
    </div>
  </div>
  <script type="module">
    import { APPS, appUrl, lastApp } from "./js/apps.js";
    import { syncStatus, setUpSync, syncNow, disconnectSync } from "./js/sync.js";

    const fmtDate = (iso) => new Date(iso).toLocaleDateString("en-AU", { weekday: "short", day: "numeric", month: "short" });
    const readList = (key) => {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return Array.isArray(v) ? v : [];
      } catch {
        return [];
      }
    };
    const lastSession = (key) => {
      const list = readList(key).filter((s) => s && !Number.isNaN(Date.parse(s.start)));
      return list.length ? `Last session ${fmtDate(list[list.length - 1].start)} · ${list.length} in total` : "";
    };

    // A line of progress for apps that keep a history.
    async function status(key) {
      if (key === "pilates") return lastSession("pilates-timer:history");
      if (key === "mobility") {
        const line = lastSession("mobility:history");
        try {
          const store = await import("./mobility/js/store.js");
          return [line, `Mobility score ${store.score(store.loadLevels())}%`].filter(Boolean).join(" · ");
        } catch {
          return line;
        }
      }
      return "";
    }

    const last = lastApp();
    const box = document.getElementById("apps");
    box.style.cssText = "display:flex;flex-direction:column;gap:10px";
    const statusLines = [];
    for (const app of APPS) {
      const a = document.createElement("a");
      a.className = "app-card";
      a.href = appUrl(app.path);
      a.innerHTML = `<img src="${app.icon}" alt=""><div><b></b><p></p><div class="status"></div></div><span class="chev">›</span>`;
      a.querySelector("b").textContent = app.name;
      if (app.key === last) a.querySelector("b").insertAdjacentHTML("beforeend", '<span class="last">Last used</span>');
      a.querySelector("p").textContent = app.blurb;
      const line = a.querySelector(".status");
      statusLines.push(() => status(app.key).then((t) => { line.textContent = t; }));
      box.append(a);
    }
    const refreshCards = () => statusLines.forEach((f) => f());
    refreshCards();

    // ---------- sync ----------
    const $ = (id) => document.getElementById(id);
    function el(tag, attrs = {}, ...kids) {
      const e = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
        else if (k === "class") e.className = v;
        else e.setAttribute(k, v);
      }
      e.append(...kids);
      return e;
    }
    const ago = (ms) => {
      const s = Math.round((Date.now() - ms) / 1000);
      if (s < 45) return "just now";
      if (s < 3600) return `${Math.round(s / 60)} min ago`;
      if (s < 86400) return `${Math.round(s / 3600)} h ago`;
      return new Date(ms).toLocaleDateString("en-AU", { day: "numeric", month: "short" });
    };
    let busy = false;

    function drawSync() {
      const st = syncStatus();
      const panel = $("sync");
      if (!st.setUp) {
        panel.replaceChildren(
          el("div", {}, el("b", {}, "SYNC BETWEEN DEVICES"),
            el("p", {}, "Keep Pilates and Mobility progress the same on your iPhone and computer, through a private GitHub gist.")),
          el("div", { class: "btns" }, el("button", { class: "btn primary", onclick: openSetup }, "Set up")));
        return;
      }
      const line = busy ? el("p", {}, "Syncing…")
        : st.error ? el("p", { class: "err" }, st.error)
        : el("p", { class: "ok" }, st.last ? `Synced ${ago(st.last)}` : "Not synced yet");
      panel.replaceChildren(
        el("div", {}, el("b", {}, "SYNC"), line),
        el("div", { class: "btns" },
          el("button", { class: "btn", onclick: runSync }, "Sync now"),
          el("button", { class: "btn", onclick: openManage }, "Options")));
    }

    async function runSync() {
      if (busy) return;
      busy = true;
      drawSync();
      try {
        await syncNow();
      } catch {
        // shown from syncStatus().error
      }
      busy = false;
      drawSync();
    }

    const openSheet = (body, buttons) => {
      $("sheetBody").replaceChildren(...body);
      $("sheetButtons").replaceChildren(...buttons);
      $("sheet").hidden = false;
    };
    const closeSheet = () => ($("sheet").hidden = true);
    const TOKEN_URL = "https://github.com/settings/tokens/new?scopes=gist&description=Training%20app%20sync";

    function openSetup() {
      const input = el("input", { type: "password", autocomplete: "off", autocapitalize: "off", spellcheck: "false", placeholder: "ghp_…" });
      const msg = el("p", { class: "hint" }, "");
      const connect = el("button", { class: "btn primary", onclick: async () => {
        connect.disabled = true;
        msg.textContent = "Connecting to GitHub…";
        try {
          await setUpSync(input.value);
          closeSheet();
          refreshCards();
        } catch (e) {
          msg.textContent = e.message;
        }
        connect.disabled = false;
        drawSync();
      } }, "Connect");
      openSheet([
        el("h2", {}, "SET UP SYNC"),
        el("p", { class: "hint" }, "Progress is stored in a secret gist in your GitHub account. Do this once on each device, with the same token or a new one."),
        el("ol", { class: "setup" },
          el("li", {}, "Sign in to GitHub (a free account is fine), then ",
            el("a", { href: TOKEN_URL, target: "_blank", rel: "noopener" }, "create a token"),
            ". The link fills in the name and ticks the gist permission; choose an expiry (No expiration avoids renewing it) and select Generate token."),
          el("li", {}, "Copy the token, paste it below and select Connect."),
          el("li", {}, "On your other device, open Training, select Set up and paste the same token. Its progress is merged with this one's.")),
        input,
        msg,
        el("p", { class: "hint" }, "The token is kept on this device only and is sent only to GitHub. A secret gist is not listed publicly, but anyone with its link can read it; it holds session dates, exercises and levels, nothing else."),
      ], [el("button", { class: "btn", onclick: closeSheet }, "Cancel"), el("span", { class: "spacer" }), connect]);
      setTimeout(() => input.focus(), 50);
    }

    function openManage() {
      const st = syncStatus();
      openSheet([
        el("h2", {}, "SYNC"),
        el("p", { class: "hint" }, st.last ? `Last synced ${ago(st.last)}.` : "Not synced yet."),
        el("p", { class: "hint" }, "Sync runs automatically when an app opens and after each workout or check-in. It shares Pilates and Mobility session history and Mobility levels; settings and Stretch Timer programs stay on each device."),
        el("p", { class: "hint" }, "Disconnect removes the token from this device. Progress already on this device and in the gist is kept."),
      ], [el("button", { class: "btn", onclick: () => {
        if (!confirm("Disconnect sync on this device?")) return;
        disconnectSync();
        closeSheet();
        drawSync();
      } }, "Disconnect"), el("span", { class: "spacer" }), el("button", { class: "btn primary", onclick: closeSheet }, "Close")]);
    }

    $("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
    window.addEventListener("training-sync", (e) => {
      if (e.detail.localChanged) refreshCards();
      drawSync();
    });
    drawSync();
    // sync on opening (and on returning to the app), at most once a minute
    const syncIfDue = () => {
      const st = syncStatus();
      if (st.setUp && Date.now() - st.last > 60000) runSync();
    };
    syncIfDue();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncIfDue(); });
    setInterval(() => { if (!busy) drawSync(); }, 30000);

    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
